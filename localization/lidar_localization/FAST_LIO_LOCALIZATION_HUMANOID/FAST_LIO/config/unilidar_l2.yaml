/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    common:
      lid_topic: "/unilidar/cloud"
      imu_topic: "/unilidar/imu"
      time_sync_en: false
    preprocess:
      lidar_type: 2
      scan_line: 18
      blind: 0.3
      timestamp_unit: 0
      scan_rate: 10
    mapping:
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: true
      extrinsic_T: [0.007698, 0.014655, -0.00667]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
    publish:
      path_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
      map_en: true
    pcd_save:
      pcd_save_en: true
      interval: -1
