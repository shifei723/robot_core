hobot_llm_sdk:
  path: agent_pipeline/D-Robotics_LLM_S100_1.0.0_SDK
  version: 1.0.0
  distribution: vendor_archive   # 地平线官方 SDK 包，947M，不进仓
  contents:
    - oellm_build/hbdk4_compiler-4.4.8a2...whl   (577M)
    - oellm_build/leap_llm-1.0.0-py310-none-any.whl
    - arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz (119M)
    - oellm_runtime/{include,config,set_performance_mode.sh}   # 后者进仓
  kept_in_repo:
