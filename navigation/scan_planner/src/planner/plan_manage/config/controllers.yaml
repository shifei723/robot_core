closed_loop_controller:
  ros__parameters:
    use_sim_time: false
    # 静态差速跟踪：横向误差纠偏与曲率转向前馈。
    static_lateral_feedback: true
    # 仅平面、差速、动态预测关闭且高度安全控制关闭时启用。
    static_spatial_tracking: true
    # 平面动态轨迹使用空间进度，候选以差速运动模型预测并检查 FRS。
    frs_spatial_tracking: true
    # 可选局部避险恢复：预测等待位置有冲突时检查前进/转向候选。
    planned_local_speed_required: false
    joint_rollout_required: false
    active_escape_enabled: false
    active_escape_horizon: 2.5
    active_escape_max_speed: 0.5
    static_cruise_speed: 0.5
    static_acceleration_limit: 0.5
    static_progress_timeout: 2.5
    static_body_radius: 0.30
    static_body_offset: 0.18
    static_map_resolution: 0.05
    static_ground_height: 0.0
    time_forward: 0.8
    heading_error_threshold: 0.8
    kp_pos: 0.8
    kp_yaw: 1.5
    max_vx: 0.75
    max_vy: 0.0
    max_vyaw: 1.0
    finish_dist: 0.15

open_loop_controller:
  ros__parameters:
    use_sim_time: false
    frame_id: world
    child_frame_id: base
    publish_rate: 100.0
    yaw_min_speed: 0.05
    hold_final_position: true
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0

go2_kinematic_sim:
  ros__parameters:
    use_sim_time: false
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0
    max_vx: 0.75
    max_vy: 0.35
    max_vyaw: 1.0
    cmd_timeout: 0.3
    sim_rate: 100.0
    publish_tf: true
    frame_id: world
    child_frame_id: base

go2_gait_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 60.0
    gait_frequency: 2.2
    min_walk_speed: 0.05
    max_walk_speed: 1.0
    always_trot: false
    hip_swing: 0.08
    thigh_swing: 0.32
    calf_swing: 0.42

slash_kinematic_sim:
  ros__parameters:
    use_sim_time: false
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0
    max_vx: 0.75
    max_vy: 0.35
    max_vyaw: 1.0
    cmd_timeout: 0.3
    sim_rate: 100.0
    publish_tf: true
    frame_id: world
    child_frame_id: base_link

slash_gait_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 60.0

slash_leg_controller:
  ros__parameters:
    use_sim_time: false
    rate: 50.0              # 控制频率 Hz
    target_height: 0.25     # 目标腿高 m
    ramp_rate: 0.5          # 腿高插值速率 m/s
    speed_kp: 0.1           # 速度环 P 增益
    wheel_radius: 0.066     # 轮子半径 m
