mockamap_node:
  ros__parameters:
    use_sim_time: false
    seed: 127
    update_freq: 0.5
    resolution: 0.1
    x_length: 20
    y_length: 20
    z_length: 3
    type: 5
    surface_resolution: 0.05
    # indoor scene params (used when type=5)
    indoor.room_width: 20.0
    indoor.room_length: 20.0
    indoor.wall_thickness: 0.2
    indoor.wall_height: 2.5
    # 隔墙门洞 + 上方低矮横梁: 机器人必须下蹲从横梁下钻过去
    indoor.door_width: 2.0
    indoor.beam_enable: true
    indoor.beam_clearance: 0.62   # 横梁底面高度(净空), 规划器按 0.05 栅格向下取整为 0.60
    indoor.beam_depth: 0.6        # 横梁沿 y 方向厚度, 即需要保持低姿的隧道长度
    # 机器人几何: 与 planner.yaml 的 grid_map.* 保持一致, 仅用于校验横梁高度是否合理
    indoor.body_top_offset: 0.328 # base_link -> 机器人顶部
    indoor.base_z_min: 0.17       # 最低机身高度(全蹲)
    indoor.base_z_nominal: 0.28   # 标称机身高度
    indoor.clearance_margin: 0.03
    indoor.planner_resolution: 0.05
    # 通行条件: 净空 >= base_z + body_top_offset + clearance_margin
    #   >= 0.638 -> 直接走过;  [0.55, 0.60] -> 必须下蹲;  < 0.528 -> 完全过不去
    # type 2 params (unused in indoor mode)
    # complexity: 0.05
    # fill: 0.12
    # fractal: 1
    # attenuation: 0.1
    # width_min: 0.2
    # width_max: 0.8
    # height_min: 2.0
    # height_max: 2.0
    # obstacle_number: 500

pcl_render_node:
  ros__parameters:
    use_sim_time: false
    quadrotor_name: quad_0
    sensor_type: lidar
    body_pose_topic: body_pose
    map.resolution: 0.1
    map.x_size: 20.0
    map.y_size: 20.0
    map.z_size: 3.0
    sensing_horizon: 40.0
    sensing_rate: 10.0
    estimation_rate: 10.0
    polar_resolution: 0.2
    yaw_fov: 360.0
    vertical_fov: 90.0
    min_raylength: 1.0
    downsample_res: 0.1
    lidar_pitch: 25.0    # Mid-360 native [-7,+52] -> body frame [-18,+27], balanced horizontal coverage
    is_360lidar: 1
    use_minicf_pattern: 1
    use_avia_pattern: 0
    use_vlp32_pattern: 0
    use_os64_pattern: 0
    use_os128_pattern: 0
    cam_width: 640
    cam_height: 480
    cam_fx: 387.229248046875
    cam_fy: 387.229248046875
    cam_cx: 321.04638671875
    cam_cy: 243.44969177246094
    dynamic.enable: 1
    dynamic.object_size: 0.4
    dynamic.object_height: 1.2
    dynamic.object_count: 10
    dynamic.mode: 0
    dynamic.velocity: 0.5
    dynamic.ground_mode: 1
    collision_check.enable: 0
    collision_check.range: 0.3
    use_global_map_topic: true
    pcd_map_file: ''

odom_visualization:
  ros__parameters:
    use_sim_time: false
    frame_id: world
    child_frame_id: base
    publish_tf: true
    mesh_resource: ""
    robot_scale: 1.0
    color.r: 0.0
    color.g: 0.0
    color.b: 0.0
    color.a: 1.0
